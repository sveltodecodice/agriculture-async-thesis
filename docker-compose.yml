x-common-env: &common-env
  FARM_CONFIG: /app/config/farm.yaml
  MQTT_BROKER_PASS: ${MQTT_BROKER_PASS:-secure_farm}

x-common-volumes: &common-volumes
  - ./certs:/app/certs:ro
  - ./config/farm.yaml:/app/config/farm.yaml:ro

x-base-service: &base-service
  restart: unless-stopped
  depends_on:
    mqtt-broker:
      condition: service_healthy
  networks:
    - farm_network

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [farm_network]

  ambient_sensor_a:
    <<: *base-service
    build: ./ambient_sensor
    container_name: ambient_sensor_a
    environment:
      <<: *common-env
      FIELD_NAME: field_a
    volumes: *common-volumes

  terrain_sensor_a:
    <<: *base-service
    build: ./terrain_sensor
    container_name: terrain_sensor_a
    environment:
      <<: *common-env
      FIELD_NAME: field_a
    volumes: *common-volumes

  plantation_sensor_a:
    <<: *base-service
    build: ./plantation_sensor
    container_name: plantation_sensor_a
    environment:
      <<: *common-env
      FIELD_NAME: field_a
    volumes: *common-volumes

  seeder_actuator_a:
    <<: *base-service
    build: ./seeder
    container_name: seeder_a
    environment:
      <<: *common-env
      FIELD_NAME: field_a
    volumes: *common-volumes

  irrigator_actuator_a:
    <<: *base-service
    build: ./irrigator
    container_name: irrigator_a
    environment:
      <<: *common-env
      FIELD_NAME: field_a
    volumes: *common-volumes

  harvester_actuator_a:
    <<: *base-service
    build: ./harvester
    container_name: harvester_a
    environment:
      <<: *common-env
      FIELD_NAME: field_a
    volumes:
      - ./certs:/app/certs:ro
      - ./config/farm.yaml:/app/config/farm.yaml:ro
      - ./harvester/data:/app/data

  ambient_sensor_b:
    <<: *base-service
    build: ./ambient_sensor
    container_name: ambient_sensor_b
    environment:
      <<: *common-env
      FIELD_NAME: field_b
    volumes: *common-volumes

  terrain_sensor_b:
    <<: *base-service
    build: ./terrain_sensor
    container_name: terrain_sensor_b
    environment:
      <<: *common-env
      FIELD_NAME: field_b
    volumes: *common-volumes

  plantation_sensor_b:
    <<: *base-service
    build: ./plantation_sensor
    container_name: plantation_sensor_b
    environment:
      <<: *common-env
      FIELD_NAME: field_b
    volumes: *common-volumes

  seeder_actuator_b:
    <<: *base-service
    build: ./seeder
    container_name: seeder_b
    environment:
      <<: *common-env
      FIELD_NAME: field_b
    volumes: *common-volumes

  irrigator_actuator_b:
    <<: *base-service
    build: ./irrigator
    container_name: irrigator_b
    environment:
      <<: *common-env
      FIELD_NAME: field_b
    volumes: *common-volumes

  harvester_actuator_b:
    <<: *base-service
    build: ./harvester
    container_name: harvester_b
    environment:
      <<: *common-env
      FIELD_NAME: field_b
    volumes:
      - ./certs:/app/certs:ro
      - ./config/farm.yaml:/app/config/farm.yaml:ro
      - ./harvester/data:/app/data

  ambient_sensor_c:
    <<: *base-service
    build: ./ambient_sensor
    container_name: ambient_sensor_c
    environment:
      <<: *common-env
      FIELD_NAME: field_c
    volumes: *common-volumes

  terrain_sensor_c:
    <<: *base-service
    build: ./terrain_sensor
    container_name: terrain_sensor_c
    environment:
      <<: *common-env
      FIELD_NAME: field_c
    volumes: *common-volumes

  plantation_sensor_c:
    <<: *base-service
    build: ./plantation_sensor
    container_name: plantation_sensor_c
    environment:
      <<: *common-env
      FIELD_NAME: field_c
    volumes: *common-volumes

  seeder_actuator_c:
    <<: *base-service
    build: ./seeder
    container_name: seeder_c
    environment:
      <<: *common-env
      FIELD_NAME: field_c
    volumes: *common-volumes

  irrigator_actuator_c:
    <<: *base-service
    build: ./irrigator
    container_name: irrigator_c
    environment:
      <<: *common-env
      FIELD_NAME: field_c
    volumes: *common-volumes

  harvester_actuator_c:
    <<: *base-service
    build: ./harvester
    container_name: harvester_c
