      <<: *common-env
    volumes:
      - ./certs:/app/certs:ro
      - ./config/farm.yaml:/app/config/farm.yaml:ro
      - ./camp_manager/data:/app/data

  dashboard:
    <<: *base-service
    build: ./dashboard
    container_name: dashboard
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      <<: *common-env
    volumes: *common-volumes

networks:
  farm_network:
    driver: bridge
