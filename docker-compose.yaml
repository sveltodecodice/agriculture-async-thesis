networks:
  farm_network:
    driver: bridge

services:
  # 1. MQTT Broker (Mosquitto SSL)
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./certs:/mosquitto/certs
    networks:
      - farm_network

  # 2. Ambient Sensor
  ambient_sensor:
    build:
      context: ./ambient_sensor
      dockerfile: Dockerfile
    container_name: ambient_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  # 3. Terrain Sensor
  terrain_sensor:
    build:
      context: ./terrain_sensor
      dockerfile: Dockerfile
    container_name: terrain_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  # 4. Plantation Sensor
  plantation_sensor:
    build:
      context: ./plantation_sensor
      dockerfile: Dockerfile
    container_name: plantation_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  # 5. Camp Manager
  camp_manager:
    build:
      context: ./camp_manager
      dockerfile: Dockerfile
    container_name: camp_manager_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
      - ./camp_manager/data:/app/data
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  # 6. Streamlit Reactive Dashboard
  dashboard_app:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard_app
    ports:
      - "8501:8501"
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network
