networks:
  farm_network:
    driver: bridge

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqtt-broker
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./certs:/mosquitto/certs
    networks:
      - farm_network

  ambient_sensor:
    build:
      context: ./ambient_sensor
      dockerfile: Dockerfile
    container_name: ambient_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  terrain_sensor:
    build:
      context: ./terrain_sensor
      dockerfile: Dockerfile
    container_name: terrain_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  plantation_sensor:
    build:
      context: ./plantation_sensor
      dockerfile: Dockerfile
    container_name: plantation_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  camp_manager:
    build:
      context: ./camp_manager
      dockerfile: Dockerfile
    container_name: camp_manager_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
      - ./camp_manager/data:/app/data
    depends_on:
      - mqtt-broker
    networks:
      - farm_network

  dashboard_app:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard_app
    ports:
      - "8501:8501"
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
      - ./camp_manager/core/seeds.py:/app/seeds.py
    depends_on:
      - mqtt-broker
    networks:
      - farm_network
