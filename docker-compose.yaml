
services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    platform: linux/amd64
    container_name: mqtt_broker
    ports:
      - "1883:1883" 
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ambient-sensor:
    build: ./ambient_sensor
    container_name: ambient_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mqtt-broker

  terrain-sensor:
    build: ./terrain_sensor
    container_name: terrain_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mqtt-broker

  plantation-sensor:
    build: ./plantation_sensor
    container_name: plantation_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mqtt-broker

  camp-manager:
    build: ./camp_manager
    container_name: camp_manager_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mqtt-broker
      
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
    depends_on:
      - mqtt-broker

volumes:
  node_red_data:

  
