services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5671:5671"   # AMQPS cifrato
      - "15672:15672" # Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: farm_admin
      RABBITMQ_DEFAULT_PASS: secure_farm
    volumes:
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./certs:/etc/rabbitmq/certs:ro
    networks:
      - farm_net

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    environment:
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    ports:
      - "8883:8883"   # MQTTS cifrato
    volumes:
      - ./config:/mosquitto/config
      - ./certs:/mosquitto/certs:ro
    networks:
      - farm_net

  ambient-sensor:
    build: ./ambient_sensor
    container_name: ambient_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - RABBITMQ_USER=farm_admin
      - RABBITMQ_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
      - rabbitmq
    networks:
      - farm_net

  terrain-sensor:
    build: ./terrain_sensor
    container_name: terrain_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - RABBITMQ_USER=farm_admin
      - RABBITMQ_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
      - rabbitmq
    networks:
      - farm_net

  plantation-sensor:
    build: ./plantation_sensor
    container_name: plantation_sensor_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - RABBITMQ_USER=farm_admin
      - RABBITMQ_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
      - rabbitmq
    networks:
      - farm_net

  camp-manager:
    build: ./camp_manager
    container_name: camp_manager_app
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5671
      - RABBITMQ_USER=farm_admin
      - RABBITMQ_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
      - rabbitmq
    networks:
      - farm_net

  dashboard:
    build: ./dashboard
    container_name: dashboard_app
    ports:
      - "8501:8501"
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=8883
      - MQTT_BROKER_USER=farm_admin
      - MQTT_BROKER_PASS=secure_farm
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_net

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
      - ./certs:/data/certs:ro
    depends_on:
      - mqtt-broker
    networks:
      - farm_net

networks:
  farm_net:
    driver: bridge

volumes:
  node_red_data:
