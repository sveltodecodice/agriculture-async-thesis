farm:
  name: Smart Farm
  fields:
  - field_a
  - field_b
  - field_c
mqtt:
  host: mqtt-broker
  port: 8883
  username: farm_admin
  ca_cert: /app/certs/ca.crt
  keepalive: 60
  reconnect_seconds: 5
  qos: 2
  tls:
    minimum_version: TLSv1.2
simulation:
  start_date: 01/01/2026
  environment_publish_interval_seconds: 10
  plantation_publish_interval_seconds: 3
  soil_layout:
    mode: random
    seed: 2026
    available_types:
    - Franco
    - Sabbioso
    - Franco-Sabbioso
    - Franco-Argilloso
    - Argilloso
fields:
  field_a:
    terrain:
      soil_type: random
      initial_moisture: 28.0
      initial_oxygenation: 70.0
  field_b:
    terrain:
      soil_type: random
      initial_moisture: 28.0
      initial_oxygenation: 70.0
  field_c:
    terrain:
      soil_type: random
      initial_moisture: 28.0
      initial_oxygenation: 70.0
terrain:
  soil_factors:
    sandy: 1.1
    sabbioso: 1.1
    loam: 1.0
    franco: 1.0
    sandy-loam: 1.05
    franco-sabbioso: 1.05
    franco sabbioso: 1.05
    clay-loam: 0.95
    franco-argilloso: 0.95
    franco argilloso: 0.95
    clay: 0.9
    argilloso: 0.9
environment:
  temperature_ranges:
    autumn:
    - 16
    - 22
    winter:
    - 12
    - 16
    spring:
    - 20
    - 25
    summer:
    - 28
    - 35
  weather_probability:
    winter:
      rain: 0.3
      cloudy: 0.4
      sun: 0.3
    spring:
      rain: 0.2
      cloudy: 0.3
      sun: 0.5
    summer:
      rain: 0.1
      cloudy: 0.2
      sun: 0.7
    autumn:
      rain: 0.3
      cloudy: 0.4
      sun: 0.3
  radiation_ranges:
    summer:
    - 600.0
    - 850.0
    spring:
    - 450.0
    - 650.0
    autumn:
    - 300.0
    - 500.0
    winter:
    - 150.0
    - 300.0
automation:
  irrigation:
    empty_field_min_moisture: 15.0
    target_margin: 5.0
    minimum_amount_pct: 2.0
  oxygenation:
    minimum_percentage: 30.0
  planting:
    empty_days_before_auto_seed: 3
    check_interval_seconds: 4
  harvesting:
    automatic: true
health:
  offline_after_seconds: 30.0
  publish_interval_seconds: 5
  manager_heartbeat_interval_seconds: 5
  manager_heartbeat_max_age_seconds: 15
irrigator:
  status_interval_seconds: 5
  action_delay_seconds: 0.5
  reoxygenation_target: 100.0
dashboard:
  port: 8501
  polling_interval_seconds: 2
  mqtt_client_id: smart-farm-dashboard
